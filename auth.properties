# ==============================================================
# ProjectUK Local Auth & Validation Configuration
# ==============================================================

# Enable or disable local signups
auth.allow_local_signup=true

# Automatically verify email for local signups (bypasses SMTP requirement)
auth.auto_verify_email=true

# Default role assigned to new signups (member, contributor, moderator, admin)
auth.default_role=member

# --------------------------------------------------------------
# Pre-seeded accounts for local development & role testing
# Format: user.<id>=email,password,role,displayName
# --------------------------------------------------------------
user.1=admin@projectuk.local,Admin123!,admin,Local Administrator
user.2=moderator@projectuk.local,Mod123!,moderator,Local Moderator
user.3=contributor@projectuk.local,Post123!,contributor,Local Contributor
user.4=test@projectuk.local,Test123!,member,Test Member

