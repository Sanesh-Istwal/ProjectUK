version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: projectuk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectuk
      POSTGRES_PASSWORD: projectuk_dev_password
      POSTGRES_DB: projectuk_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Lightweight S3-compatible local object storage (for image uploads)
  minio:
    image: minio/minio:latest
    container_name: projectuk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

